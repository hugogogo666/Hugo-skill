name: 将 Skill 目录改为中文

on:
  push:
    paths:
      - ".github/workflows/rename-to-chinese.yml"

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 重命名并更新说明
        shell: bash
        run: |
          set -euo pipefail
          git mv "amazon-ad-execution-erp-demo" "亚马逊自动广告系统"
          git mv "amazon-ad-plan-skill" "亚马逊广告方案"
          git mv "amazon-asin-keyword-library-pipeline" "亚马逊词库"
          git mv "amazon-batch-75-char-title" "亚马逊批量改75字符"
          git mv "amazon-competitive-intelligence-monitor" "亚马逊竞品分析系统"
          git mv "amazon-sellercentral-batch-discounts" "亚马逊批量改折扣"
          git mv "ozon-home-to-1688-sourcing-pipeline" "Ozon选品+1688获取货源"

          python3 <<'PY'
          from pathlib import Path

          readme = """# Hugo Skill 合集

          本仓库收录以下 Codex Skills，全部以文件夹形式保存，不包含 ZIP 压缩包：

          - 亚马逊自动广告系统（Skill ID：amazon-ad-execution-erp-demo）
          - 亚马逊广告方案（Skill ID：amazon-ad-plan-skill）
          - 亚马逊词库（Skill ID：amazon-asin-keyword-library-pipeline）
          - 亚马逊批量改75字符（Skill ID：amazon-batch-75-char-title）
          - 亚马逊竞品分析系统（Skill ID：amazon-competitive-intelligence-monitor）
          - 亚马逊批量改折扣（Skill ID：amazon-sellercentral-batch-discounts）
          - Ozon选品+1688获取货源（Skill ID：ozon-home-to-1688-sourcing-pipeline）

          每个 Skill 的使用说明见对应目录下的 SKILL.md。目录使用中文便于浏览，Skill ID 保留英文以确保 Codex 正常识别和调用。
          """
          readme = "\n".join(line.removeprefix("          ") for line in readme.splitlines()) + "\n"
          Path("README.md").write_text(readme, encoding="utf-8")

          path = Path("亚马逊批量改折扣/SKILL.md")
          text = path.read_text(encoding="utf-8").replace(
              "$WENMAI_HOME/skills/amazon-sellercentral-batch-discounts/",
              "$WENMAI_HOME/skills/亚马逊批量改折扣/",
          )
          path.write_text(text, encoding="utf-8")

          path = Path("亚马逊竞品分析系统/SKILL.md")
          text = path.read_text(encoding="utf-8").replace(
              "/Users/mac/.codex/skills/amazon-competitive-intelligence-monitor/",
              "/Users/mac/.codex/skills/亚马逊竞品分析系统/",
          )
          path.write_text(text, encoding="utf-8")
          PY

          git rm ".github/workflows/rename-to-chinese.yml"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "将 Skill 文件夹改为中文名称"
          git push
